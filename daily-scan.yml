name: Daily Qullamaggie scan → Slack

on:
  schedule:
    # Hafta içi 12:40 UTC = 15:40 İstanbul (ABD açılışından ~2 saat önce)
    - cron: "40 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Fiyat cache'i + önceki tarama/sinyal dosyaları + paper hesap durumu
      # günden güne taşınır (NEW rozetleri ve paper simülasyonu için gerekli).
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            cache
            scans
            paper_trades
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Scan
        id: scan
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            python -m scanner --no-open && exit 0
            echo "Tarama başarısız, 5 dk sonra tekrar ($i/3)"; sleep 300
          done
          exit 1

      - name: Paper simulation
        continue-on-error: true
        run: |
          python -m scanner --paper || true
          python -m scanner --paper-status > paper_status.txt 2>&1 || true

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache
            scans
            paper_trades
          key: scanner-state-${{ github.run_id }}

      - name: Today's date
        if: always()
        run: echo "TODAY=$(date +%F)" >> "$GITHUB_ENV"

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_number }}
          path: |
            scans/scan_${{ env.TODAY }}.html
            scans/signals_${{ env.TODAY }}.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Post to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAPER_STATUS_FILE: paper_status.txt
        run: python scripts/slack_notify.py --top 10
